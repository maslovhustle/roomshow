<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#07060c">
  <title>roomshow — turn the room into the show</title>
</head>
<body class="landing">
  <main class="card">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="rs" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#25e6d0"/>
            <stop offset="1" stop-color="#b95cff"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#rs)" stroke-linecap="round">
          <path d="M15 48a19 19 0 1 1 34 0" stroke-width="5"/>
          <path d="M25 45a10 10 0 1 1 14 0" stroke-width="5"/>
        </g>
        <circle cx="32" cy="31" r="3.6" fill="url(#rs)"/>
      </svg>
      <div>
        <h1>roomshow</h1>
        <p class="lede">Point a phone at the room. Project it back, restyled, live.</p>
      </div>
    </div>

    <label for="code">Session code</label>
    <input id="code" type="text" class="mono" maxlength="8" autocomplete="off" spellcheck="false">

    <button class="primary" id="openStage">Open stage →</button>

    <div class="row-2" style="margin-top:10px">
      <button id="openRemote">Open remote</button>
      <button id="newCode">New code</button>
    </div>

    <a class="explore-link" href="explore.html">Browse all 80 looks →</a>

    <p class="hint">
      Open the <strong>stage</strong> on the machine wired to the projector, then open the
      <strong>remote</strong> on your phone with the same code.
    </p>
  </main>

  <script type="module" src="/src/landing.ts"></script>
</body>
</html>
